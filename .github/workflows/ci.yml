name: CI

# Runs on every push and PR. Builds, runs acap-verify, and runs the functional
# test suite across macOS / Linux / Windows on Node 22 (the supported floor).
# A separate Linux-only `coverage` job enforces 100% line coverage on the core
# library modules.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Fail fast on a hung test instead of burning the 6h job ceiling.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --omit=optional skips node-pty's native build (it's optional and not
      # imported), so CI never fails on a missing C++ toolchain.
      - name: Install
        run: npm ci --omit=optional

      - name: Build
        run: npm run build

      - name: Conformance (acap-verify)
        run: node dist/cli.js selfcheck

      - name: Test (unit + integration)
        run: npm test

  # Coverage gate runs on Linux only: it enforces 100% line coverage on the core
  # library modules, several of which have platform-divergent branches (POSIX
  # unix-socket vs Windows TCP) that can't all be exercised on a single OS.
  # The process entrypoint (cli) and the OS-spawning leaf adapters
  # (installer-daemon, pty, process-fallback, codex, openclaw) are excluded —
  # they're validated by the integration/subprocess tests above, not line %.
  coverage:
    name: coverage · 100% line (core libs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install
        run: npm ci --omit=optional

      - name: Build
        run: npm run build

      - name: Test + 100% line coverage gate
        run: npm run test:coverage

  # Smoke-test the bootstrap installers end to end — the scripts a user runs
  # first, which the TS suite never executes. Runs them against the local
  # checkout (no clone, since package.json is present): install.sh on
  # Linux/macOS, install.ps1 under Windows PowerShell (`shell: powershell` =
  # Windows PowerShell 5.1 / Desktop, NOT pwsh 7) so it reproduces the
  # 5.1-specific native-arg quoting that broke the Node version check.
  # AGENT_ADAPTER_SKIP_DAEMON stops it registering a background service on the
  # runner; npm_config_omit=optional skips node-pty's native build.
  installer:
    name: installer smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENT_ADAPTER_SKIP_DAEMON: "1"
      npm_config_omit: optional
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Run install.sh (bash)
        if: runner.os != 'Windows'
        shell: bash
        env:
          AGENT_ADAPTER_HOME: ${{ runner.temp }}/aca-home
        run: |
          bash install.sh
          node dist/cli.js selfcheck   # post-condition: the installer built a working CLI

      - name: Run install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AGENT_ADAPTER_HOME: ${{ runner.temp }}/aca-home
        run: |
          .\install.ps1
          node dist\cli.js selfcheck   # post-condition: built a working CLI — also catches the node -v quoting bug
