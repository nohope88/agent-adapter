name: CI

# Runs on every push and PR. Builds, runs acap-verify, and runs the test suite
# (unit + the hub integration test) across macOS / Linux / Windows on Node 22 & 24.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --omit=optional skips node-pty's native build (it's optional and not
      # imported), so CI never fails on a missing C++ toolchain.
      - name: Install
        run: npm ci --omit=optional

      - name: Build
        run: npm run build

      - name: Conformance (acap-verify)
        run: node dist/cli.js verify

      - name: Test (unit + integration)
        run: npm test
